[platformio]
src_dir = firmware/DragonRadar
lib_dir = lib

[env:esp32-s3-touch-amoled-175c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = waveshare_esp32_s3_touch_amoled_175c
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 32MB
board_build.partitions = partitions_dragon_radar_32mb.csv
lib_deps =
  links2004/WebSockets @ ^2.6.1
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -DUSE_PRIVATE_BOOT_LOGO=1
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFi/src
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/NetworkClientSecure/src
lib_ldf_mode = deep+

[env:esp32-s3-touch-amoled-175c-field]
extends = env:esp32-s3-touch-amoled-175c

[env:esp32-s3-touch-amoled-175c-fielddiag]
extends = env:esp32-s3-touch-amoled-175c-field
build_flags =
  ${env:esp32-s3-touch-amoled-175c-field.build_flags}
  -DDRAGON_RADAR_FRAME_MS=20
  -DDRAGON_RADAR_SERIAL_DIAG=1
  -DDRAGON_RADAR_SOUND_EFFECTS=1
  -DDRAGON_RADAR_AUDIO_GAIN=180

[env:esp32-s3-touch-amoled-175c-debug]
extends = env:esp32-s3-touch-amoled-175c
build_flags =
  ${env:esp32-s3-touch-amoled-175c.build_flags}
  -DDRAGON_RADAR_DEBUG_HUD=1
  -DDRAGON_RADAR_SCAN_LINE=1
  -DDRAGON_RADAR_STAR_BLIPS=1

[env:esp32-s3-touch-amoled-175c-diag]
extends = env:esp32-s3-touch-amoled-175c
build_flags =
  ${env:esp32-s3-touch-amoled-175c.build_flags}
  -DDRAGON_RADAR_DEBUG_HUD=1
  -DDRAGON_RADAR_SCAN_LINE=1
  -DDRAGON_RADAR_STAR_BLIPS=1
  -DDRAGON_RADAR_SERIAL_DIAG=1

[env:esp32-s3-touch-amoled-175c-beach]
extends = env:esp32-s3-touch-amoled-175c
build_flags =
  ${env:esp32-s3-touch-amoled-175c.build_flags}
  -DDRAGON_RADAR_BEACH_SCENE=1
  -DDRAGON_RADAR_SERIAL_DIAG=1
  -DDRAGON_RADAR_AUDIO_GAIN=180
