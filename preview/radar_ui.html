<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>胶囊雷达 UI 预览</title>
  <style>
    :root {
      color-scheme: dark;
      --screen: #032411;
      --grid: #14dc54;
      --grid-bright: #78ff66;
      --grid-dim: #00562c;
      --shell: #eee7da;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #c5d7d5 0%, #7e9d9e 56%, #4e696d 100%);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    .wrap {
      display: grid;
      gap: 16px;
      justify-items: center;
      padding: 22px;
    }

    .device {
      position: relative;
      width: min(92vw, 560px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 24%, #fffdf3 0 12%, transparent 35%),
        radial-gradient(circle at 52% 56%, #f1eadf 0 56%, #b6afa3 76%, #827b70 100%);
      box-shadow:
        0 28px 70px rgba(24, 40, 42, 0.34),
        inset -18px -22px 0 rgba(86, 80, 70, 0.28),
        inset 13px 14px 0 rgba(255, 255, 255, 0.56);
    }

    .device::before {
      content: "";
      position: absolute;
      inset: 8.5%;
      border-radius: 50%;
      border: 9px solid #f7f3ea;
      box-shadow:
        inset 0 0 0 5px #8a857a,
        0 4px 5px rgba(50, 43, 34, 0.26);
      pointer-events: none;
    }

    canvas {
      width: 76.4%;
      height: 76.4%;
      border-radius: 50%;
      background: var(--screen);
      box-shadow:
        0 0 0 8px #4f4b43,
        0 0 0 14px #f5f0e6,
        inset 0 0 42px rgba(0, 0, 0, 0.28);
      touch-action: none;
    }

    .button {
      position: absolute;
      width: 50px;
      height: 20px;
      top: 50%;
      border-radius: 999px;
      background: linear-gradient(#fff6eb, #c8bfb0);
      border: 2px solid #817a70;
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.72),
        0 2px 2px rgba(57, 48, 38, 0.28);
      pointer-events: none;
    }

    .button.left {
      left: 2.5%;
      transform: rotate(90deg);
    }

    .button.right {
      right: 2.5%;
      transform: rotate(90deg);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="device" aria-label="胶囊雷达 UI 预览">
      <canvas id="radar" width="466" height="466"></canvas>
      <div class="button left" aria-hidden="true"></div>
      <div class="button right" aria-hidden="true"></div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("radar");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const W = canvas.width;
    const H = canvas.height;
    const CX = W / 2;
    const CY = H / 2;
    const R = Math.min(CX, CY);
    const query = new URLSearchParams(location.search);
    const scene = query.get("shot");
    const fixedScenes = new Set(["boot", "radar", "idle", "acquire", "zoom", "lock", "controls", "touch", "tilt"]);
    const fixedScene = fixedScenes.has(scene);
    const phaseValue = Number.parseFloat(query.get("phase"));
    const fixedPhase = Number.isFinite(phaseValue) ? Math.min(1, Math.max(0, phaseValue)) : 1;
    const fixedNow = 120000;
    const bootDurationMs = 2800;
    const mainFadeMs = 620;
    const initOverlayMs = 980;
    const touchEchoMs = 520;
    const longPressMs = 800;
    const zoomLevels = [1, 1.48, 2.12];
    const gridPitches = [32, 32, 32];
    const brightnessLevels = [55, 100, 125];
    const audioLevels = [0, 70, 100, 130];

    const members = [
      { id: "M1", bearing: 32, range: 0.36, drift: 0.3 },
      { id: "M2", bearing: 88, range: 0.58, drift: 1.4 },
      { id: "M3", bearing: 143, range: 0.44, drift: 2.5 },
      { id: "M4", bearing: 198, range: 0.72, drift: 3.7 },
      { id: "M5", bearing: 300, range: 0.66, drift: 5.3 }
    ];

    let boot = true;
    let bootBeganAt = performance.now();
    let radarBeganAt = 0;
    let zoom = 0;
    let chosenIndex = 0;
    let lockedIndex = -1;
    let headingDeg = 0;
    let gestureScale = 1;
    let brightnessLevel = 1;
    let audioLevel = 2;
    let zoomFlashUntil = 0;
    let lockFlashUntil = 0;
    let headingFlashUntil = 0;
    let brightnessFlashUntil = 0;
    let audioFlashUntil = 0;
    let touchEchoUntil = 0;
    let touchEcho = { x: CX, y: CY };
    let pressBeganAt = 0;
    let edgeGesture = false;
    let edgePointerId = null;
    let edgeAngle = 0;
    let edgeConsumed = false;

    function syncState() {
      document.documentElement.dataset.boot = boot ? "1" : "0";
      document.documentElement.dataset.zoom = String(zoom);
      document.documentElement.dataset.chosenMember = members[chosenIndex].id;
      document.documentElement.dataset.lockedMember = lockedIndex >= 0 ? members[lockedIndex].id : "";
      document.documentElement.dataset.heading = String(Math.round(headingDeg));
    }

    function clampScale(value) {
      return Math.min(1.9, Math.max(0.55, value));
    }

    function gridPitch() {
      return Math.max(10, Math.round(gridPitches[zoom] * gestureScale));
    }

    function mapScale() {
      return zoomLevels[zoom] * gestureScale;
    }

    function resetView(now) {
      zoom = 0;
      chosenIndex = 0;
      lockedIndex = -1;
      headingDeg = 0;
      gestureScale = 1;
      zoomFlashUntil = now + 520;
      lockFlashUntil = 0;
      headingFlashUntil = 0;
      syncState();
    }

    function cycleZoom(now) {
      zoom = (zoom + 1) % zoomLevels.length;
      zoomFlashUntil = now + 700;
      syncState();
    }

    function chooseNextMember(now) {
      chosenIndex = (chosenIndex + 1) % members.length;
      lockFlashUntil = now + 420;
      syncState();
    }

    function toggleMemberLock(now) {
      lockedIndex = lockedIndex === chosenIndex ? -1 : chosenIndex;
      lockFlashUntil = now + 700;
      syncState();
    }

    function rotateHeading(delta, now) {
      headingDeg = ((headingDeg + delta) % 360 + 360) % 360;
      headingFlashUntil = now + 760;
      syncState();
    }

    function pointFromEvent(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * W / rect.width,
        y: (event.clientY - rect.top) * H / rect.height
      };
    }

    function angleOfPoint(point) {
      return Math.atan2(point.y - CY, point.x - CX) * 180 / Math.PI;
    }

    function angleDelta(from, to) {
      let delta = ((to - from) % 360 + 360) % 360;
      if (delta > 180) delta -= 360;
      return delta;
    }

    function pointInEdge(point) {
      const dx = point.x - CX;
      const dy = point.y - CY;
      const distance = Math.hypot(dx, dy);
      return distance >= 142 && distance <= R + 18;
    }

    function clearEdgeGesture() {
      edgeGesture = false;
      edgePointerId = null;
      edgeAngle = 0;
    }

    function updateEdgeGesture(point, pointerId, now) {
      if (!pointInEdge(point)) return false;
      if (boot) {
        boot = false;
        radarBeganAt = now;
      }
      edgeConsumed = true;
      const angle = angleOfPoint(point);
      if (!edgeGesture) {
        edgeGesture = true;
        edgePointerId = pointerId;
        edgeAngle = angle;
        return true;
      }
      if (edgePointerId !== pointerId) return true;
      const delta = angleDelta(edgeAngle, angle);
      edgeAngle = angle;
      if (Math.abs(delta) < 0.6 || Math.abs(delta) > 55) return true;
      gestureScale = clampScale(gestureScale * Math.exp(delta * 0.007));
      zoomFlashUntil = now + 260;
      syncState();
      return true;
    }

    function setTouchEcho(point, now) {
      const dx = point.x - CX;
      const dy = point.y - CY;
      const distance = Math.hypot(dx, dy);
      const limit = R - 16;
      const scale = distance > limit ? limit / distance : 1;
      touchEcho = { x: CX + dx * scale, y: CY + dy * scale };
      touchEchoUntil = now + touchEchoMs;
    }

    canvas.addEventListener("pointerdown", (event) => {
      canvas.setPointerCapture?.(event.pointerId);
      const now = performance.now();
      const point = pointFromEvent(event);
      pressBeganAt = now;
      updateEdgeGesture(point, event.pointerId, now);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (edgePointerId !== event.pointerId) return;
      updateEdgeGesture(pointFromEvent(event), event.pointerId, performance.now());
    });

    canvas.addEventListener("pointerup", (event) => {
      const now = performance.now();
      const point = pointFromEvent(event);
      if (edgePointerId === event.pointerId || edgeConsumed) {
        edgeConsumed = false;
        clearEdgeGesture();
        return;
      }
      if (now - pressBeganAt >= longPressMs) {
        headingDeg = 0;
        headingFlashUntil = now + 900;
      } else {
        chooseNextMember(now);
        setTouchEcho(point, now);
      }
      syncState();
    });

    canvas.addEventListener("pointercancel", () => {
      edgeConsumed = false;
      clearEdgeGesture();
    });

    function handleKey(rawKey, now = performance.now()) {
      if (fixedScene) return false;
      const key = rawKey === "Space" ? " " : String(rawKey).toLowerCase();
      if (key === " " || key === "c") {
        if (boot) {
          boot = false;
          radarBeganAt = now;
        } else {
          chooseNextMember(now);
        }
      } else if (key === "z") {
        cycleZoom(now);
      } else if (key === "l") {
        toggleMemberLock(now);
      } else if (key === "t") {
        rotateHeading(30, now);
      } else if (key === "r") {
        resetView(now);
      } else if (key === "b") {
        brightnessLevel = (brightnessLevel + 1) % brightnessLevels.length;
        brightnessFlashUntil = now + 700;
      } else if (key === "a") {
        audioLevel = (audioLevel + 1) % audioLevels.length;
        audioFlashUntil = now + 700;
      } else {
        return false;
      }
      syncState();
      return true;
    }

    window.__capsuleRadarPreview = {
      press(rawKey) {
        return handleKey(rawKey, performance.now());
      },
      state() {
        syncState();
        return { ...document.documentElement.dataset };
      }
    };

    window.addEventListener("keydown", (event) => {
      if (event.metaKey || event.ctrlKey || event.altKey) return;
      if (handleKey(event.key, performance.now())) event.preventDefault();
    });

    function hex(value, alpha = 1) {
      if (alpha >= 1) return value;
      const raw = value.replace("#", "");
      const r = Number.parseInt(raw.slice(0, 2), 16);
      const g = Number.parseInt(raw.slice(2, 4), 16);
      const b = Number.parseInt(raw.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function ease(edge0, edge1, value) {
      const t = Math.min(1, Math.max(0, (value - edge0) / (edge1 - edge0)));
      return t * t * (3 - 2 * t);
    }

    function text(value, x, y, size, fill, align = "center") {
      ctx.save();
      ctx.font = `${size}px ui-monospace, Menlo, Consolas, monospace`;
      ctx.textAlign = align;
      ctx.textBaseline = "middle";
      ctx.fillStyle = fill;
      ctx.shadowColor = fill;
      ctx.shadowBlur = 5;
      ctx.fillText(value, x, y);
      ctx.restore();
    }

    function clipScreen() {
      ctx.beginPath();
      ctx.arc(CX, CY, R, 0, Math.PI * 2);
      ctx.clip();
    }

    function clearScreen() {
      ctx.clearRect(0, 0, W, H);
      ctx.save();
      clipScreen();
      ctx.fillStyle = "#032411";
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    function drawBrandMark(x, y, phase) {
      const pulse = Math.sin(phase * Math.PI) * 10;
      const frame = ease(0, 0.24, phase);
      const ring = ease(0.15, 0.56, phase);
      const point = ease(0.38, 0.72, phase);
      const words = ease(0.58, 0.92, phase);

      ctx.save();
      ctx.shadowColor = "#4ea6ff";
      ctx.shadowBlur = 14 + pulse;
      if (frame > 0) {
        const halfWidth = (117 + pulse / 2) * frame;
        ctx.strokeStyle = "#4ea6ff";
        ctx.lineWidth = 1;
        ctx.strokeRect(x - halfWidth, y - 53, halfWidth * 2, 106);
        ctx.beginPath();
        ctx.moveTo(x - 128 * frame, y);
        ctx.lineTo(x + 128 * frame, y);
        ctx.moveTo(x, y - 64 * frame);
        ctx.lineTo(x, y + 64 * frame);
        ctx.stroke();
      }
      if (ring > 0) {
        const radius = 36 + 46 * ring;
        ctx.strokeStyle = ring > 0.55 ? "#78ff66" : "#14dc54";
        ctx.lineWidth = 3;
        for (const ratio of [1, 0.62, 0.3]) {
          ctx.beginPath();
          ctx.arc(x, y, radius * ratio, 0, Math.PI * 2);
          ctx.stroke();
        }
        const angle = -Math.PI * 0.55 + ring * Math.PI * 1.35;
        ctx.strokeStyle = "#78ff66";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(angle) * (radius - 6), y + Math.sin(angle) * (radius - 6));
        ctx.stroke();
      }
      if (point > 0) {
        const angle = -Math.PI * 0.22;
        const distance = 54 * point;
        const px = x + Math.cos(angle) * distance;
        const py = y + Math.sin(angle) * distance;
        ctx.fillStyle = "#e9fff0";
        ctx.beginPath();
        ctx.arc(px, py, 4 + 5 * point, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#14dc54";
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      if (words > 0.58) text("CAPSULE", x, y + 100, 17, "#14dc54");
      if (words > 0.78) text("RADAR", x, y + 122, 12, "#00562c");
      ctx.restore();
    }

    function drawGrid(alpha = 1) {
      const pitch = gridPitch();
      const extent = R * 1.6;
      ctx.save();
      clipScreen();
      ctx.translate(CX, CY);
      ctx.rotate(-headingDeg * Math.PI / 180);
      ctx.strokeStyle = hex("#0c9d47", 0.78 * alpha);
      ctx.lineWidth = 1;
      for (let offset = -extent; offset <= extent; offset += pitch) {
        ctx.beginPath();
        ctx.moveTo(-extent, offset);
        ctx.lineTo(extent, offset);
        ctx.moveTo(offset, -extent);
        ctx.lineTo(offset, extent);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawScan(now, alpha = 1) {
      const angle = ((now / 1945) % 1) * Math.PI * 2 - Math.PI / 2;
      const outer = R - 9;
      const inner = 16;
      ctx.save();
      clipScreen();
      for (const [span, color, value] of [
        [0.60, "#0a4d2c", 0.08],
        [0.45, "#139443", 0.16],
        [0.30, "#27d95d", 0.25],
        [0.15, "#69ff85", 0.38]
      ]) {
        ctx.fillStyle = hex(color, value * alpha);
        ctx.beginPath();
        ctx.moveTo(CX + Math.cos(angle - span) * inner, CY + Math.sin(angle - span) * inner);
        ctx.lineTo(CX + Math.cos(angle - span) * outer, CY + Math.sin(angle - span) * outer);
        ctx.arc(CX, CY, outer, angle - span, angle, false);
        ctx.lineTo(CX + Math.cos(angle) * inner, CY + Math.sin(angle) * inner);
        ctx.arc(CX, CY, inner, angle, angle - span, true);
        ctx.closePath();
        ctx.fill();
      }
      ctx.strokeStyle = hex("#78ff66", 0.92 * alpha);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.lineTo(CX + Math.cos(angle) * outer, CY + Math.sin(angle) * outer);
      ctx.stroke();
      ctx.restore();
    }

    function drawCenterMarker(now) {
      const pulse = 0.5 + 0.5 * Math.sin(now / 180);
      const height = 14 + pulse * 5;
      const half = height * 0.86;
      ctx.save();
      ctx.fillStyle = "#ff2c20";
      ctx.shadowColor = "#ff2c20";
      ctx.shadowBlur = 7 + pulse * 8;
      ctx.beginPath();
      ctx.moveTo(CX, CY - height);
      ctx.lineTo(CX - half, CY + height * 0.5);
      ctx.lineTo(CX + half, CY + height * 0.5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function memberPoint(member, now, forceInside = false) {
      const drift = Math.sin(now / 2600 + member.drift) * 1.7;
      const angle = (member.bearing + drift - headingDeg - 90) * Math.PI / 180;
      let radius = member.range * mapScale() * (R - 30);
      if (!forceInside && radius > R - 12) return null;
      radius = Math.min(radius, R - 32);
      const rawX = CX + Math.cos(angle) * radius;
      const rawY = CY + Math.sin(angle) * radius;
      const step = Math.max(8, gridPitch() / 2);
      return {
        x: CX + Math.round((rawX - CX) / step) * step,
        y: CY + Math.round((rawY - CY) / step) * step
      };
    }

    function drawMemberPoint(point, chosen, locked, now) {
      const blink = (now % 1000) < 150;
      if (blink && !chosen && !locked) return;
      const radius = locked ? 9 : (chosen ? 8 : 7);
      const color = locked ? "#ffb824" : (chosen ? "#78ff66" : "#dfffe8");
      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = locked ? 11 : 6;
      ctx.fillStyle = "#032411";
      ctx.strokeStyle = color;
      ctx.lineWidth = locked ? 2.4 : 1.8;
      ctx.beginPath();
      ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(point.x, point.y, locked ? 3.2 : 2.5, 0, Math.PI * 2);
      ctx.fill();
      if (chosen) {
        ctx.strokeStyle = hex(color, 0.72);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(point.x, point.y, radius + 5, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawLockFrame(point, now) {
      const pulse = 0.5 + 0.5 * Math.sin(now / 130);
      const side = 20 + pulse * 3;
      const arm = 7;
      ctx.save();
      ctx.strokeStyle = "#ffb824";
      ctx.lineWidth = 1.5;
      ctx.shadowColor = "#ffb824";
      ctx.shadowBlur = 5 + pulse * 4;
      ctx.beginPath();
      ctx.moveTo(point.x - side, point.y - side + arm);
      ctx.lineTo(point.x - side, point.y - side);
      ctx.lineTo(point.x - side + arm, point.y - side);
      ctx.moveTo(point.x + side - arm, point.y - side);
      ctx.lineTo(point.x + side, point.y - side);
      ctx.lineTo(point.x + side, point.y - side + arm);
      ctx.moveTo(point.x - side, point.y + side - arm);
      ctx.lineTo(point.x - side, point.y + side);
      ctx.lineTo(point.x - side + arm, point.y + side);
      ctx.moveTo(point.x + side - arm, point.y + side);
      ctx.lineTo(point.x + side, point.y + side);
      ctx.lineTo(point.x + side, point.y + side - arm);
      ctx.stroke();
      ctx.restore();
    }

    function drawHeadingMark() {
      const angle = (-headingDeg - 90) * Math.PI / 180;
      const radius = R - 24;
      text("N", CX + Math.cos(angle) * radius, CY + Math.sin(angle) * radius, 13, "#78ff66");
    }

    function drawAcquireEcho(point, now) {
      const wave = (now % 760) / 760;
      const radius = 15 + wave * 28;
      ctx.save();
      ctx.strokeStyle = hex("#78ff66", 1 - wave);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawInitOverlay(now) {
      if (!radarBeganAt) return;
      const elapsed = now - radarBeganAt;
      if (elapsed > initOverlayMs) return;
      const progress = Math.min(1, elapsed / initOverlayMs);
      const color = (Math.floor(elapsed / 72) & 1) === 0 ? "#78ff66" : "#14dc54";
      const inset = 38 + ease(0, 0.55, progress) * 10;
      const left = CX - R + inset;
      const right = CX + R - inset;
      const top = CY - R + inset;
      const bottom = CY + R - inset;
      const arm = 28;
      ctx.save();
      clipScreen();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(left, top + arm);
      ctx.lineTo(left, top);
      ctx.lineTo(left + arm, top);
      ctx.moveTo(right - arm, top);
      ctx.lineTo(right, top);
      ctx.lineTo(right, top + arm);
      ctx.moveTo(left, bottom - arm);
      ctx.lineTo(left, bottom);
      ctx.lineTo(left + arm, bottom);
      ctx.moveTo(right - arm, bottom);
      ctx.lineTo(right, bottom);
      ctx.lineTo(right, bottom - arm);
      ctx.stroke();
      ctx.restore();
    }

    function drawTouchEcho(now) {
      if (now > touchEchoUntil) return;
      const age = touchEchoMs - (touchEchoUntil - now);
      const radius = 10 + Math.min(20, age / 20);
      const alpha = Math.max(0, 1 - age / touchEchoMs);
      ctx.save();
      ctx.strokeStyle = hex("#78ff66", alpha);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(touchEcho.x, touchEcho.y, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawZoomFlash(now) {
      if (now > zoomFlashUntil) return;
      const value = mapScale().toFixed(2);
      ctx.save();
      ctx.strokeStyle = "#78ff66";
      ctx.strokeRect(CX - 38, H - 58, 76, 22);
      text(`X${value}`, CX, H - 47, 11, "#78ff66");
      ctx.restore();
    }

    function drawLockFlash(now) {
      if (now > lockFlashUntil) return;
      const label = lockedIndex >= 0 ? `LOCK ${members[lockedIndex].id}` : `SELECT ${members[chosenIndex].id}`;
      text(label, CX, H - 46, 10, lockedIndex >= 0 ? "#ffb824" : "#78ff66");
    }

    function drawHeadingFlash(now) {
      if (now > headingFlashUntil) return;
      text(`HEADING ${Math.round(headingDeg)}°`, CX, 42, 10, "#78ff66");
    }

    function drawBrightnessFlash(now) {
      if (now > brightnessFlashUntil) return;
      const x = 38;
      const baseY = CY + 25;
      for (let i = 0; i < brightnessLevels.length; i++) {
        const height = 9 + i * 8;
        ctx.strokeStyle = i <= brightnessLevel ? "#78ff66" : "#00562c";
        ctx.strokeRect(x + i * 12, baseY - height, 7, height);
      }
    }

    function drawAudioFlash(now) {
      if (now > audioFlashUntil) return;
      const x = W - 46;
      const y = CY - 18;
      if (audioLevel === 0) {
        ctx.strokeStyle = "#00562c";
        ctx.strokeRect(x - 4, y + 8, 24, 24);
        ctx.strokeStyle = "#78ff66";
        ctx.beginPath();
        ctx.moveTo(x - 2, y + 30);
        ctx.lineTo(x + 18, y + 10);
        ctx.stroke();
        return;
      }
      for (let i = 0; i < audioLevels.length - 1; i++) {
        const width = 8 + i * 8;
        const yy = y + i * 12;
        ctx.strokeStyle = i < audioLevel ? "#78ff66" : "#00562c";
        ctx.beginPath();
        ctx.moveTo(x - width / 2, yy);
        ctx.lineTo(x + width / 2, yy);
        ctx.stroke();
      }
    }

    function drawPhosphorMask() {
      ctx.save();
      clipScreen();
      ctx.fillStyle = "rgba(4, 42, 18, 0.10)";
      for (let y = CY - R + 2; y <= CY + R; y += 14) {
        const offset = y - CY;
        const half = Math.sqrt(Math.max(0, R * R - offset * offset));
        ctx.fillRect(CX - half + 2, y, Math.max(0, half * 2 - 4), 1);
      }
      ctx.restore();
    }

    function drawBootFrame(phase, now, commit) {
      clearScreen();
      const fadeIn = ease(0.04, 0.46, phase);
      const fadeOut = 1 - ease(0.72, 0.96, phase);
      ctx.save();
      clipScreen();
      ctx.globalAlpha = Math.min(1, Math.max(0, fadeIn * fadeOut));
      drawBrandMark(CX, CY - 25, phase);
      ctx.restore();
      drawPhosphorMask();
      if (commit && phase >= 1) {
        boot = false;
        radarBeganAt = now;
      }
    }

    function drawRadar(now) {
      clearScreen();
      drawGrid();
      drawScan(now, 0.92);

      const points = members.map((member) => memberPoint(member, now));
      ctx.save();
      clipScreen();
      for (let i = 0; i < members.length; i++) {
        const point = points[i];
        if (!point) continue;
        drawMemberPoint(point, i === chosenIndex, i === lockedIndex, now);
      }
      ctx.restore();

      const chosenPoint = points[chosenIndex];
      if (chosenPoint) drawAcquireEcho(chosenPoint, now);
      if (lockedIndex >= 0 && points[lockedIndex]) drawLockFrame(points[lockedIndex], now);
      drawCenterMarker(now);
      drawHeadingMark();
      drawInitOverlay(now);
      drawTouchEcho(now);
      drawZoomFlash(now);
      drawLockFlash(now);
      drawHeadingFlash(now);
      drawBrightnessFlash(now);
      drawAudioFlash(now);
      drawPhosphorMask();

      if (radarBeganAt) {
        const fade = 1 - ease(0, 1, Math.min(1, (now - radarBeganAt) / mainFadeMs));
        if (fade > 0) {
          ctx.save();
          clipScreen();
          ctx.globalAlpha = fade;
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, W, H);
          ctx.restore();
        }
      }
    }

    function drawFixedScene() {
      if (scene === "boot") {
        drawBootFrame(fixedPhase, fixedNow + fixedPhase * bootDurationMs, false);
        return;
      }
      boot = false;
      radarBeganAt = 0;
      if (scene === "idle") {
        chosenIndex = 0;
      } else if (scene === "acquire") {
        chosenIndex = 1;
      } else if (scene === "zoom") {
        zoom = 2;
        zoomFlashUntil = fixedNow + 540;
      } else if (scene === "lock") {
        chosenIndex = 2;
        lockedIndex = 2;
        lockFlashUntil = fixedNow + 540;
      } else if (scene === "controls") {
        zoom = 2;
        brightnessLevel = 2;
        audioLevel = 3;
        zoomFlashUntil = fixedNow + 540;
        brightnessFlashUntil = fixedNow + 540;
        audioFlashUntil = fixedNow + 540;
      } else if (scene === "touch") {
        touchEcho = { x: CX + 42, y: CY - 18 };
        touchEchoUntil = fixedNow + 320;
      } else if (scene === "tilt") {
        headingDeg = 62;
        headingFlashUntil = fixedNow + 540;
      }
      syncState();
      drawRadar(fixedNow);
    }

    function tick(now) {
      syncState();
      if (fixedScene) {
        drawFixedScene();
        return;
      }
      if (boot) {
        drawBootFrame(Math.min((now - bootBeganAt) / bootDurationMs, 1), now, true);
      } else {
        drawRadar(now);
      }
      requestAnimationFrame(tick);
    }

    syncState();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
