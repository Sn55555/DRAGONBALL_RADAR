[platformio]
src_dir = firmware/DragonRadar
lib_dir = lib

[env:esp32-s3-touch-amoled-175c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = waveshare_esp32_s3_touch_amoled_175c
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 32MB
board_build.partitions = huge_app.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -DUSE_PRIVATE_BOOT_LOGO=1
lib_ldf_mode = deep+

[env:esp32-s3-touch-amoled-175c-field]
extends = env:esp32-s3-touch-amoled-175c
build_flags =
  ${env:esp32-s3-touch-amoled-175c.build_flags}
  -DDRAGON_RADAR_DEMO_ON_BOOT=0
  -DDRAGON_RADAR_DEMO_TOUCH=0

[env:esp32-s3-touch-amoled-175c-fielddiag]
extends = env:esp32-s3-touch-amoled-175c-field
build_flags =
  ${env:esp32-s3-touch-amoled-175c-field.build_flags}
  -DDRAGON_RADAR_SERIAL_DIAG=1

[env:esp32-s3-touch-amoled-175c-debug]
extends = env:esp32-s3-touch-amoled-175c
build_flags =
  ${env:esp32-s3-touch-amoled-175c.build_flags}
  -DDRAGON_RADAR_DEBUG_HUD=1
  -DDRAGON_RADAR_SCAN_LINE=1
  -DDRAGON_RADAR_STAR_BLIPS=1

[env:esp32-s3-touch-amoled-175c-diag]
extends = env:esp32-s3-touch-amoled-175c
build_flags =
  ${env:esp32-s3-touch-amoled-175c.build_flags}
  -DDRAGON_RADAR_DEBUG_HUD=1
  -DDRAGON_RADAR_SCAN_LINE=1
  -DDRAGON_RADAR_STAR_BLIPS=1
  -DDRAGON_RADAR_SERIAL_DIAG=1
  -DDRAGON_RADAR_DEMO_ON_BOOT=0
  -DDRAGON_RADAR_DEMO_TOUCH=0

[env:esp32-s3-touch-amoled-175c-sim]
extends = env:esp32-s3-touch-amoled-175c
build_flags =
  ${env:esp32-s3-touch-amoled-175c.build_flags}
  -DDRAGON_RADAR_SERIAL_DIAG=1
  -DDRAGON_RADAR_DEMO_ON_BOOT=0
  -DDRAGON_RADAR_DEMO_TOUCH=0
  -DDRAGON_RADAR_SIMULATED_BLE=1

[env:esp32-s3-touch-amoled-175c-sim-jtag]
extends = env:esp32-s3-touch-amoled-175c-sim
upload_protocol = esp-builtin
debug_tool = esp-builtin
debug_speed = 1000

[env:esp32-s3-touch-amoled-175c-near]
extends = env:esp32-s3-touch-amoled-175c-field
build_flags =
  ${env:esp32-s3-touch-amoled-175c-field.build_flags}
  -DDRAGON_RADAR_COLLECT_RSSI=-45
  -DDRAGON_RADAR_COLLECT_HOLD_MS=1500

[env:esp32-s3-touch-amoled-175c-beach]
extends = env:esp32-s3-touch-amoled-175c
build_flags =
  ${env:esp32-s3-touch-amoled-175c.build_flags}
  -DDRAGON_RADAR_BEACH_SCENE=1
  -DDRAGON_RADAR_SERIAL_DIAG=1
  -DDRAGON_RADAR_DEMO_ON_BOOT=0
  -DDRAGON_RADAR_DEMO_TOUCH=0
  -DDRAGON_RADAR_AUDIO_GAIN=180
